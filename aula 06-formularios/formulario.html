<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno - DSM</title>
</head>

<body>
    <h1>Cadastro de Aluno – DSM</h1>
    <p>Preencha os dados abaixo para realizar o cadastro do aluno.</p>
    <form action="#" method="POST">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome">Nome completo:*</label><br>
            <input type="text" id="nome" name="nome" placeholder="Insira seu nome completo" required>
            <br><br>
            <label for="email">E-mail:*</label><br>
            <input type="email" id="email" name="email" placeholder="Insira seu e-mail" required>
            <br><br>
            <label for="nascimento">Data de nascimento:</label><br>
            <input type="date" id="nascimento" name="nascimento">
        </fieldset>
        <br>
        <fieldset>
            <legend>Dados Acadêmicos</legend>
            <label for="curso">Curso:</label><br>
            <select id="curso" name="curso">
                <option value="">Selecione seu curso</option>
                <option value="dsm">DSM</option>
                <option value="ads">ADS</option>
                <option value="outro">Outro</option>
            </select>
            <br><br>
            <label>Período:</label><br>
            <input type="radio" id="manha" name="periodo" value="manha">
            <label for="manha">Manhã</label>
            <input type="radio" id="noite" name="periodo" value="noite">
            <label for="noite">Noite</label>
            <br><br>
            <label for="observacoes">Observações:</label><br>
            <textarea id="observacoes" name="observacoes" rows="4" cols="40"
                placeholder="Digite uma observação"></textarea>
        </fieldset>
        <br>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>

</html>
