<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>

<body>
    <h1>Formulários no HTML5</h1>
    <form action="#" method="GET">
        <label for="nome">Nome:</label><br>
        <!-- input text -->
        <input name="nome" type="text" id="nome" placeholder="Insira o seu nome"><br>
        <label for="email">E-mail:</label><br>
        <input name="emial" type="email" id="email" placeholder="Insira seu E-mail"><br>
        <label for="senha">Senha:</label><br>
        <input name="senha" type="password" id="senha" placeholder="Insira sua senha"><br>
        <br><br>
        <input type="submit" value="Cadastrar">
        <input type="reset" value="Limpar">
    </form>
    <br><br>
    <hr>
    <h4>Outros inputs</h4>

    <form>
        <label> Quantidade</label><br>
        <input type="number" min="0" max="10" /><br>
        <label>Data:</label><br>
        <input type="date" /><br><br>
        <input type="file"><br><br>
        <label>Comentarios</label><br>
        <!-- campo de texto longo -->
        <textarea rows="4" cols="40"></textarea>
        <!-- campo invisivel -->
        <input type="hidden" oi>
        <br><br>
        <select name="cursos">
            <option value="1">Programação</option>
            <option value="2">Design Gráfico</option>
            <option value="3">Medicina</option>
        </select>
    </form>
    <br><br>
    <hr>
    <h4>Cadastro do usuário</h4>
    <h2>Exemplo de formulário completo:</h2>
    <form action="#" method="POST">
        <fieldset>
            <legend>Dados pessoais:</legend>
            <label for="name">Nome:*</label>
            <input type="text" placeholder="Insira seu nome" id="name" name="name" required>
            <br>
            <label for="nascimento">Data de nascimento:</label>
            <input type="date">
            <br>
            <label for="Sexo">Sexo:</label>
            <!-- botao de escolha -->
            <input type="radio" name="sexo"> Masculino
            <input type="radio" name="sexo"> Feminino
            <input type="radio" name="sexo"> Prefiro não informar
        </fieldset>
        <br>
        <!-- todo input temq ter um name/nome -->
        <fieldset>
            <legend>Dados de endereço</legend>
            <label for=" rua">Rua:</label>
            <input type="text"><br>
            <label for="numero">Número:</label>
            <input type="number">
        </fieldset>
        <br>
        <fieldset>
            <legend>Dados de produto:</legend>
            <label>Cor do produto:</label>
            <input type="color"><br><br>
            <input type="checkbox"> Li e aceito os termos de uso
            <br><br>
            <input type="submit" value="Cadastrar">
            <input type="reset" value="Limpar">
        </fieldset>

    </form>
</body>

</html>
