<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Inline</title>
</head>
<body>
    <h1>Demonstração de CSS Inline</h1>
    <p style="color: blue; font-size: 24px;">Este parágrafo utuliza CSS Inline através do atributo style.</p>
    
    <p 
    style="color: brown;
    font-weight: bold;
    background-color: chartreuse;"
        >Outro parágrafo com múltiplas propriedades CSS Inline
    </p>
<!-- padding é o espaçamento interno  -->
 <!-- margin é o espaçamento externo -->
    <div style="border: 2px solid green; width: 400px; padding: 30px; margin:50px ;">
        Está é uma div estilizada com CSS Inline
    </div>

    <h3
    style="color: #7b1091;text-align: center;">
Título centralizado com cor hexadecimal
    </h3>

<!-- FIZ SOZINHAAAAA -->
    <div
    style="height: 400px; width: 600px; background-color: darkorange; font-size: 32px; color: aliceblue; text-align: center;">
    Desafio CSS Inline
    </div>
</body>
</html>
